# Local, production-shaped stack: real PostgreSQL + both servers.
#
#   docker compose up --build
#   open http://localhost:8787        (search)
#   open http://localhost:8788        (admin bot)
#
# The first boot seeds the demo fixtures into Postgres (SEED_ON_EMPTY=1).
# Unset it, or point DATABASE_URL at your own database, for a real deployment.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  search:
    build: .
    command: node server.mjs
    environment:
      PORT: 8787
      DATABASE_URL: postgres://app:app@db:5432/app
      SEED_ON_EMPTY: "1"
    ports: ["8787:8787"]
    depends_on:
      db: { condition: service_healthy }

  admin:
    build: .
    command: node admin-server.mjs
    environment:
      PORT: 8788
      GROUP_ID: g_design
      DATABASE_URL: postgres://app:app@db:5432/app
      SEED_ON_EMPTY: "1"
    ports: ["8788:8788"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
